[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-mathematics"
version = "0.1.0"
description = "Numerical methods for equations, interpolation, and polynomial roots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["numerical_math*", "utilities*"]
namespaces = false
